[package]
name = "tuvis"
version = "0.5.6"
description = "你的桌面多 Agent 指挥台"
authors = ["jarvis"]
edition = "2021"
# MSRV：代码实际要求 1.89——src/linker/mod.rs:271 File::unlock（1.89 稳定）、
# src/services/pet/import.rs:278 u64::is_multiple_of（1.87 稳定）；依赖侧底线更低
# （sha2 0.11 经 rust-embed-utils 要求 1.85），所以取 1.89。
# 显式声明后旧工具链会直接报错；同时会激活 clippy::incompatible_msrv，
# 以后再误用超版 API 会在 CI 直接暴露（本次即由该 lint 发现真实 MSRV 是 1.89 而非 1.85）。
rust-version = "1.89"
license = "MIT"
# src/bin/tuvis-marker.rs（issue #43 marker helper）加入后仓库存在两个 bin，
# 不指定 default-run 时 `cargo run` / `pnpm tauri:dev` 报
# "could not determine which binary to run"（2026-09-11 Windows 实机验收发现 1）
default-run = "tuvis"

[features]
# helper bin 的构建门（默认关）：额外 bin 在 macOS universal 打包下会必然失败
# （打包器要求额外 bin 存在于 universal 目录，2026-09-14 v0.4.0 tag 构建实证），
# 故全部挂 required-features 门。两个 helper：
#   - marker-helper：tuvis-marker（issue #43 窗口标题标记注入，Windows-only）
#   - hook-listener：tuvis-hook-listener（批次甲 T1 hook 事件监听 helper）
# marker-helper 蕴含 hook-listener——Windows 发布构建（release.yml）与 CI
# windows-gnu 门禁 / ubuntu 测试步已显式 `--features marker-helper`，发行与门禁
# 自动同时构建两个 helper（工作流零改动）；本地单建 hook helper 时用
# `cargo build --bin tuvis-hook-listener --features hook-listener`。
# 声明 [[bin]] 后 bin 自动发现关闭，三个 bin 均显式声明
hook-listener = []
marker-helper = ["hook-listener"]

[[bin]]
name = "tuvis"
path = "src/main.rs"

[[bin]]
name = "tuvis-marker"
path = "src/bin/tuvis-marker.rs"
required-features = ["marker-helper"]

[[bin]]
name = "tuvis-hook-listener"
path = "src/bin/tuvis-hook-listener.rs"
required-features = ["hook-listener"]

[lib]
name = "multi_agents_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# macos-private-api：Tauri v2/macOS 下透明窗口（主窗 + 通知浮窗均 transparent: true）的
# feature 门，须与 tauri.conf.json 的 app.macOSPrivateApi 成对出现；
# 该 feature 在 tauri 内部由 cfg(target_os = "macos") 门控，非 macOS 平台为空操作
tauri = { version = "2", features = ["tray-icon", "image-png", "devtools", "macos-private-api", "protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
# preserve_order（issue #36-5）：Map 用 IndexMap 保序——写回 ~/.claude.json 等
# JSON 工具配置时不再把整个文件按字母序重排（TOML/JSONC 路径本就保序）
serde_json = { version = "1", features = ["preserve_order"] }
# 0.33+ 移除了 RefreshKind::new()/ProcessRefreshKind::new()（改用 nothing()），
# 0.32 没有 nothing()，故代码迁移必须与本次 bump 同批（见 PR 说明）。
sysinfo = "0.39"
dirs = "7.0"
log = "0.4"
env_logger = "0.11"
chrono = { version = "0.4", features = ["serde"] }
once_cell = "1.19"
rusqlite = { version = "0.40", features = ["bundled"] }
dashmap = "6"
tokio = { version = "1", features = ["full"] }
fs2 = "0.4"
toml = "1.1"
toml_edit = "0.25"
trash = "5"
semver = "1"
# system-proxy：reqwest 的**默认特性**，被 default-features=false 一并关掉——M4 T1d
# 下载器不读 Windows/macOS 系统代理、直连 github.com 失败的根因，必须显式加回
# blocking：§C3（Task 7）可达性校验用——tailscale.rs 的钉 IP 探测与 DoH 取数都是
# 同步上下文（专职 std::thread / spawn_blocking），async client 反而要 runtime 缝合
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "system-proxy", "blocking"] }
# M4 T1d：cloudflared 下载完整性校验（固定版本 + release 页 SHA256 表比对；
# 0.10 本就存在于依赖树，升直依不新增传递项）
sha2 = "0.11"
zip = "8"
# dsh 会话日志为多帧拼接的 zstd 容器（M0 F1），解码用
zstd = "0.14"
tauri-plugin-dialog = "2"
# M2（远程接入）：主进程内嵌 axum 服务器 + 看板静态资源内嵌
axum = "0.8"
# include-exclude：支持 #[exclude = ".gitkeep"]（占位文件不嵌入二进制，终审修复轮）
rust-embed = { version = "8", features = ["include-exclude"] }
# 配对码 / deviceId 生成
rand = "0.10"
# M3 Task 6（SSE 端点）：BroadcastStream 把 watcher 的 broadcast::Receiver 适配成
# Stream（sync feature 即含此包装器）；futures 提供 stream::once / StreamExt::chain
# 组合首帧快照与增量流
tokio-stream = { version = "0.1", features = ["sync"] }
futures = "0.3"
# M9R 灰1（Task 7）：CLI 版本探测的有界等待——`--version` 子进程挂死时 3s 超时
# kill+收尸，不再无限等待拖垮端点（wait_timeout::ChildExt::wait_timeout）
wait-timeout = "0.2"
# **chrono-tz 已于阶段①终修（A-1 / Q-4 裁决）移除**：GC 13 当初加它的唯一理由是
# 「跨源日界优先用各源自带时区」（codex `turn_context.timezone`）。用户裁定改为
# **一律以宿主本地时区为基准**（各源时区可读入备查、不得参与键计算）后，
# `SourceTz::Named` 的生产消费点清零 ⇒ 依赖与变体一并删除（回到「新增依赖仅 base64」）。
# 契约 §3 的 export_save_bytes 以 base64 字符串收 PNG（GC 13 允许的第二项新依赖）：
# 上游 rust-lang 维护、零传递依赖；宽松解码（data URL 前缀 / 折行）由本仓包一层
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
junction = "2.1"
# Console（AttachConsole/SetConsoleTitle 路线 B）、Diagnostics_ToolHelp + FileSystem
# （父进程链遍历）为 tuvis-marker helper（src/bin）所需
# Win32_UI_Input_KeyboardAndMouse（M9R：VkKeyScanW/MapVirtualKeyW 真实键位布局）；
# Win32_UI_WindowsAndMessaging：win32（窗口枚举）/ tuvis-marker（跳转 marker）/
# deep_link（深链）；Win32_System_JobObjects（Task 6 无头 kill 树）：Job Object
# 整树收编（KILL_ON_JOB_CLOSE + TerminateJobObject，spec 附录 E-⑥）
windows = { version = "0.62", features = ["Win32_Security", "Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Accessibility", "Win32_UI_Shell", "Win32_System_Com", "Win32_System_Threading", "Win32_System_Console", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Power", "Win32_System_Registry", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock", "Win32_System_JobObjects"] }
winreg = "0.55"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true

[dev-dependencies]
tempfile = "3"
filetime = "0.2"
# preset_v2 集成测试直接取家目录（stash 测试用）；与主依赖同版本
dirs = "7.0"
# M2 axum 集成测试：tower ServiceExt::oneshot + http-body-util 读响应体
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
