<!doctype html>
<!-- lang 初始值用二值规范形 zh（与 C-1 生效语言值集一致）：JS 启动后由移动端语言
     决策模块（src/mobile/language.ts）按生效语言权威覆写（C-9/M7，首帧内容渲染前），
     此处仅是 JS 前的静态兜底。标题「Tuvis 远程」按 U5/M6 保持现状不随语言切换 -->
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f8f3e9" />
    <!-- 相对路径：页面伺服在 /m 下，构建后解析为 /m/manifest.json（public-mobile 拷入 dist-mobile 根） -->
    <link rel="manifest" href="manifest.json" />
    <title>Tuvis 远程</title>
    <!-- P8f 防闪白：首帧前（早于 React 挂载）按已存主题/系统偏好设置 dark 类。
         默认分支与 src/mobile/theme.ts 逐字对齐：无已存值且系统非浅色偏好 → 加 dark 类；
         key "tuvis-theme" 与 theme.ts 的 KEY 严格一致。此处必须内联：
         外链模块加载前页面已绘制，任何延后设置都会闪白 -->
    <script>
      try {
        const t = localStorage.getItem("tuvis-theme");
        if (t === "light" || (!t && matchMedia("(prefers-color-scheme: light)").matches)) {
          document.documentElement.classList.remove("dark");
        } else {
          document.documentElement.classList.add("dark");
        }
      } catch {
        // 隐私模式 localStorage/matchMedia 抛错：保守回退 dark（与 theme.ts 默认一致）
        document.documentElement.classList.add("dark");
      }
      // 2026-10-05 UI 改版：外观配置镜像（key "mam-ui-config" 与 theme.ts 严格一致）——
      // 首帧前把皮肤/字体/圆角写到 data 属性（mobile.css 按属性切 Token 表）。
      // 三级回退：这里读镜像 → main.tsx 权威应用 → 服务器值覆写；本步失败仅回落默认
      try {
        const u = JSON.parse(localStorage.getItem("mam-ui-config") || "null");
        if (u && typeof u.daySkin === "string" && typeof u.nightSkin === "string") {
          const dark = document.documentElement.classList.contains("dark");
          document.documentElement.dataset.skin = dark ? u.nightSkin : u.daySkin;
          document.documentElement.dataset.fontTheme = String(u.font || "std");
          document.documentElement.dataset.radius = String(u.radius ?? 12);
        }
      } catch {
        // 坏 JSON / 隐私模式：不动属性 = 默认纸感对/标准/12px
      }
    </script>
  </head>
  <body class="bg-[var(--pg)]">
    <div id="root"></div>
    <script type="module" src="/src/mobile/main.tsx"></script>
  </body>
</html>
