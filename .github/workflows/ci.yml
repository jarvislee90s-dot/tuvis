name: CI

on:
  # main 分支不再自动跑 CI，需要时在 Actions 页面或 gh workflow run 手动触发
  workflow_dispatch:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# pull_request 事件下 paths-filter 需调 GitHub API 读 PR 文件列表
permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      # paths-filter 仅在 PR 事件下执行（走 GitHub API 读文件列表）；
      # 手动触发时各检查任务无条件全跑，无需过滤，且 dispatch 无 diff 基线
      - name: Detect changed paths
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            frontend:
              - "docs/capabilities.json"
              - "README.md"
              - "README.zh-CN.md"
              - "src/**"
              - "packages/dsh-remote-access/**"
              - "resources/dsh/**"
              # 错误码门禁在 frontend job 同时消费 Rust/TS 源；后端独改也必须触发。
              - "src-tauri/src/**"
              - "scripts/**"
              - "eslint.config.js"
              - "tests/**"
              - "index.html"
              - "mobile.html"
              - "public-mobile/**"
              - "vite.config.mobile.ts"
              - "package.json"
              - "pnpm-lock.yaml"
              - "pnpm-workspace.yaml"
              - "tsconfig.json"
              - "tsconfig.node.json"
              - "vite.config.ts"
              - "vitest.config.ts"
              - "components.json"
              - ".github/workflows/**"
            backend:
              - "src-tauri/**"
              - "resources/dsh/**"
              - "rust-toolchain.toml"
              - ".github/workflows/**"

  # tauri 版本对齐门禁：tauri CLI 的同一条检查藏在 pnpm tauri build 内部，
  # 要等 apt-get + Rust 工具链 + 编译才失败（PR #86/#91 各跑了约 2.5 分钟才吐一行 mismatch）。
  # 本 job 只读两个锁文件，约 10 秒失败并直接指名哪几对不一致。
  parity:
    name: Tauri version parity
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.frontend == 'true' || needs.changes.outputs.backend == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-tauri-parity.mjs

  frontend:
    name: Frontend Checks
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.frontend == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm check:capabilities
      - run: pnpm format:check
      - run: pnpm check:i18n
      - run: node scripts/check-error-codes.mjs
      - run: pnpm build
      - run: pnpm test
      - run: pnpm --filter @tuvis/dsh-remote-access test
      - run: node scripts/build-dsh-plugin.mjs --check

  backend:
    name: Backend Checks
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.backend == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # M2-R1：后端内嵌移动看板静态资源（rust-embed 读 ../dist-mobile/），
      # cargo 步骤前必须有 node/pnpm 环境 + build:mobile 产物，否则 fresh checkout
      # 的静态伺服测试必红（入口 404）
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config file libssl-dev patchelf xdg-utils \
            libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev \
            libwebkit2gtk-4.1-dev libsoup-3.0-dev

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build mobile entry (rust-embed prerequisite)
        run: pnpm build:mobile

      # 格式门禁放最前：不依赖编译、秒级失败（PR #38 曾因无此门禁合入未格式化代码）
      - run: cd src-tauri && cargo fmt --check
      - run: cd src-tauri && cargo check
      - run: cd src-tauri && cargo clippy -- -D warnings
      # --features marker-helper：tuvis-marker bin 有 required-features 门控（默认不构建），
      # 显式启用让其纯函数单测（strip_marker_suffix 等）继续在 ubuntu 跑
      # -j 2（限并行度）：多个用例会并发建/删**同一路径**的 junction / 软链
      # （tool_settings 的建链还原、usage::project 的 junction 用例），默认并行度下
      # 互相踩踏 → 随机数十例 FAILED（本机实测：默认并行 51 failed，-j 1 只有既有的
      # 5 例 HOME 隔离基线，且串行更快）。这是既有测试脆弱性，与业务代码无关；
      # 限并行度让门禁稳定，真正的根治（共享锁串行化建链用例）另立。
      # 注意：此步骤**不** export TUVIS_HOME/DSH_HOME/TUVIS_DSH_STATE_DIR——
      # lib 守卫用例（database::connection::real_entry_point_is_isolated_in_this_process）
      # 验证 lib 单测进程不读用户环境；需要隔离数据根的 DSH 回归（含 m05 生产根
      # 来源测试）统一在下方 security probes 步骤的显式清单里跑。
      # opencode-coordinator-tests：保留底层成功回归；同套 B1 用例仍走生产未知归属门。
      - run: cd src-tauri && cargo test --features marker-helper,opencode-coordinator-tests -j 2

      # 关键 DSH 竞态探针默认不编译；显式启用并隔离三个数据根。
      - name: DSH security regression probes
        run: |
          TEST_ROOT="$(mktemp -d)"
          trap 'rm -rf "$TEST_ROOT"' EXIT
          export TUVIS_HOME="$TEST_ROOT/tuvis" DSH_HOME="$TEST_ROOT/dsh" TUVIS_DSH_STATE_DIR="$TEST_ROOT/state"
          cd src-tauri
          cargo test --features dsh-test-probes \
            --test dsh_hello_registered_race_test \
            --test dsh_ipc_late_console_credential_test \
            --test h09_console_ws_pending_test \
            --test dsh_auth_event_proofs_barrier_test \
            --test dsh_m04_auth_rendezvous_race_test \
            --test dsh_m04_rendezvous_multiround_uds_test \
            --test dsh_m04_real_ipc_pressure_test \
            --test dsh_m04_peer_channel_blocking_test \
            --test dsh_m06_arm_intent_regression_test \
            --test dsh_close_pending_failclosed_recovery_test \
            --test dsh_switch_upgrade_rejoin_console_test \
            --test dsh_install_test \
            --test dsh_macos_desktop_cli_web_discovery_test \
            --test dsh_management_cross_process_lock_test \
            --test m05_file_replacement_race_test \
            --test m05_file_protected_roots_test \
            --test dsh_media_route_test \
            -- --test-threads=1

      # cfg(windows) 编译门禁（issue #45）：CI host 是 linux，win32.rs 等整模块
      # #[cfg(windows)] 代码在上述步骤中不可达、破损静默通过（detector.rs:732 一例）。
      # 交叉编译只编译不运行，无需 windows runner / wine；check/clippy 不链接，
      # mingw 仅作兜底依赖（--all-targets 含测试代码的编译）
      - name: Add Windows cross target
        run: rustup target add x86_64-pc-windows-gnu
      - name: Install mingw-w64 cross toolchain
        run: sudo apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64
      # --features marker-helper：让 tuvis-marker bin（Windows-only helper）进入门禁
      - run: cd src-tauri && cargo check --target x86_64-pc-windows-gnu --all-targets --features marker-helper
      - run: cd src-tauri && cargo clippy --target x86_64-pc-windows-gnu --all-targets --features marker-helper -- -D warnings

  opencode-macos:
    name: OpenCode macOS regression
    runs-on: macos-15-intel
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.backend == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:mobile
      - name: Run macOS OpenCode tests
        working-directory: src-tauri
        run: |
          cargo test --locked --features opencode-coordinator-tests --lib opencode_native -- --test-threads=4
          cargo test --locked --features opencode-coordinator-tests --lib close_does_not_kill_opencode
          cargo test --locked --features opencode-coordinator-tests --test opencode_native_remote --test opencode_pin_readonly --test opencode_attachment_binding_regression

      - name: Run macOS DSH Web identity tests
        working-directory: src-tauri
        run: cargo test --locked --test dsh_web_home_r01_test -- --test-threads=1

  build:
    name: Build verification
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.frontend == 'true' || needs.changes.outputs.backend == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config file libssl-dev patchelf xdg-utils \
            libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev \
            libwebkit2gtk-4.1-dev libsoup-3.0-dev

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri App
        run: pnpm tauri build --no-bundle

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: pr-build-binaries
          path: src-tauri/target/release/tuvis
          if-no-files-found: error
