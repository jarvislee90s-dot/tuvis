name: CI

on:
  # main 分支不再自动跑 CI，需要时在 Actions 页面或 gh workflow run 手动触发
  workflow_dispatch:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# pull_request 事件下 paths-filter 需调 GitHub API 读 PR 文件列表
permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      # paths-filter 仅在 PR 事件下执行（走 GitHub API 读文件列表）；
      # 手动触发时各检查任务无条件全跑，无需过滤，且 dispatch 无 diff 基线
      - name: Detect changed paths
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            frontend:
              - "src/**"
              # 错误码门禁在 frontend job 同时消费 Rust/TS 源；后端独改也必须触发。
              - "src-tauri/src/**"
              - "scripts/**"
              - "eslint.config.js"
              - "tests/**"
              - "index.html"
              - "mobile.html"
              - "public-mobile/**"
              - "vite.config.mobile.ts"
              - "package.json"
              - "pnpm-lock.yaml"
              - "pnpm-workspace.yaml"
              - "tsconfig.json"
              - "tsconfig.node.json"
              - "vite.config.ts"
              - "vitest.config.ts"
              - "components.json"
              - ".github/workflows/**"
            backend:
              - "src-tauri/**"
              - "rust-toolchain.toml"
              - ".github/workflows/**"

  # tauri 版本对齐门禁：tauri CLI 的同一条检查藏在 pnpm tauri build 内部，
  # 要等 apt-get + Rust 工具链 + 编译才失败（PR #86/#91 各跑了约 2.5 分钟才吐一行 mismatch）。
  # 本 job 只读两个锁文件，约 10 秒失败并直接指名哪几对不一致。
  parity:
    name: Tauri version parity
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.frontend == 'true' || needs.changes.outputs.backend == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-tauri-parity.mjs

  frontend:
    name: Frontend Checks
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.frontend == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm check:i18n
      - run: node scripts/check-error-codes.mjs
      - run: pnpm build
      - run: pnpm test

  backend:
    name: Backend Checks
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.backend == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # M2-R1：后端内嵌移动看板静态资源（rust-embed 读 ../dist-mobile/），
      # cargo 步骤前必须有 node/pnpm 环境 + build:mobile 产物，否则 fresh checkout
      # 的静态伺服测试必红（入口 404）
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config file libssl-dev patchelf xdg-utils \
            libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev \
            libwebkit2gtk-4.1-dev libsoup-3.0-dev

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build mobile entry (rust-embed prerequisite)
        run: pnpm build:mobile

      # 格式门禁放最前：不依赖编译、秒级失败（PR #38 曾因无此门禁合入未格式化代码）
      - run: cd src-tauri && cargo fmt --check
      - run: cd src-tauri && cargo check
      - run: cd src-tauri && cargo clippy -- -D warnings
      # --features marker-helper：tuvis-marker bin 有 required-features 门控（默认不构建），
      # 显式启用让其纯函数单测（strip_marker_suffix 等）继续在 ubuntu 跑
      - run: cd src-tauri && cargo test --features marker-helper

      # cfg(windows) 编译门禁（issue #45）：CI host 是 linux，win32.rs 等整模块
      # #[cfg(windows)] 代码在上述步骤中不可达、破损静默通过（detector.rs:732 一例）。
      # 交叉编译只编译不运行，无需 windows runner / wine；check/clippy 不链接，
      # mingw 仅作兜底依赖（--all-targets 含测试代码的编译）
      - name: Add Windows cross target
        run: rustup target add x86_64-pc-windows-gnu
      - name: Install mingw-w64 cross toolchain
        run: sudo apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64
      # --features marker-helper：让 tuvis-marker bin（Windows-only helper）进入门禁
      - run: cd src-tauri && cargo check --target x86_64-pc-windows-gnu --all-targets --features marker-helper
      - run: cd src-tauri && cargo clippy --target x86_64-pc-windows-gnu --all-targets --features marker-helper -- -D warnings

  # codex-desktop-ipc（R10）：Windows 原生 named pipe 运行 job——交叉编译只保证
  # 编译面，`transport::windows` 的真实 pipe 往返/忙重试（ERROR_PIPE_BUSY=231）
  # 必须在 windows runner 上运行；Desktop 不在 runner 上，假 server 用随机专属 pipe
  windows-native:
    name: Windows native IPC tests
    runs-on: windows-latest
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.backend == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # rust-embed 前置：与 ubuntu backend job 同因（fresh checkout 缺 dist-mobile 必红）
      - run: pnpm install --frozen-lockfile && pnpm build:mobile
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run Windows-native transport tests
        working-directory: src-tauri
        run: cargo test --features marker-helper --lib codex_desktop_ipc::transport::windows:: -- --nocapture

  build:
    name: Build verification
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.frontend == 'true' || needs.changes.outputs.backend == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config file libssl-dev patchelf xdg-utils \
            libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev \
            libwebkit2gtk-4.1-dev libsoup-3.0-dev

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri App
        run: pnpm tauri build --no-bundle

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: pr-build-binaries
          path: src-tauri/target/release/tuvis
          if-no-files-found: error
