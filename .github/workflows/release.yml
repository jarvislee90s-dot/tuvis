name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          - os: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add macOS universal targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build mobile frontend
        # dist-mobile 产物不入库（.gitkeep 占位），rust-embed 构建期嵌入——
        # 每个 runner 都要先构建移动端，否则发布包里 /m 远程页为空
        run: pnpm check:capabilities && pnpm build:mobile

      - name: Configure Tauri signing
        shell: bash
        run: |
          if [ -n "${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}" ]; then
            echo "TAURI_SIGNING_PRIVATE_KEY is set — updater artifacts will be signed."
            RAW="${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}"
            KEY_PATH="$RUNNER_TEMP/tauri_signing.key"
            if printf '%s' "$RAW" | head -n1 | grep -q '^untrusted comment:'; then
              printf '%s\n' "$RAW" > "$KEY_PATH"
            elif DECODED=$(printf '%s' "$RAW" | base64 --decode 2>/dev/null) \
                 && echo "$DECODED" | head -n1 | grep -q '^untrusted comment:'; then
              printf '%s\n' "$DECODED" > "$KEY_PATH"
            else
              printf '%s\n%s\n' "untrusted comment: tauri signing key" "$RAW" > "$KEY_PATH"
            fi
            echo "TAURI_SIGNING_PRIVATE_KEY=$(base64 < "$KEY_PATH" | tr -d '\r\n')" >> "$GITHUB_ENV"
            if [ -n "${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}" ]; then
              echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}" >> "$GITHUB_ENV"
            fi
          else
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY not set. Disabling updater artifacts for this build."
            echo "::warning::Generate one with: pnpm tauri signer generate -w ~/.tauri/tuvis.key"
            echo "::warning::Then add the private key to GitHub Secrets as TAURI_SIGNING_PRIVATE_KEY."
            jq '.bundle.createUpdaterArtifacts = false' src-tauri/tauri.conf.json > src-tauri/tauri.conf.json.tmp
            mv src-tauri/tauri.conf.json.tmp src-tauri/tauri.conf.json
          fi

      - name: Build Tauri App (macOS)
        if: runner.os == 'macOS'
        shell: bash
        # app bundle 必须与 dmg 一起构建：macOS updater 产物（*.app.tar.gz + .sig）
        # 由 app bundle 派生，只打 dmg 不会生成（v0.1.0/v0.2.0 均因此缺 darwin 平台）
        run: pnpm tauri build --bundles app,dmg --target universal-apple-darwin

      - name: Build Tauri App (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        # --features marker-helper：tuvis-marker helper 仅 Windows 发布构建打包
        # （macOS universal 只对主二进制 lipo，额外 bin 会令打包失败，见 Cargo.toml 注释）
        run: pnpm tauri build --bundles nsis --features marker-helper

      - name: Prepare macOS Assets
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          VERSION="${GITHUB_REF_NAME#v}"
          DMG=$(find src-tauri/target -name "*.dmg" -type f | head -1 || true)
          TAR=$(find src-tauri/target -name "*.app.tar.gz" -type f | head -1 || true)
          if [ -z "$DMG" ]; then
            echo "::error::No macOS DMG found" >&2
            exit 1
          fi
          cp "$DMG" "release-assets/Tuvis-${VERSION}-macOS.dmg"
          [ -f "${DMG}.sig" ] && cp "${DMG}.sig" "release-assets/Tuvis-${VERSION}-macOS.dmg.sig" || true
          if [ -n "$TAR" ]; then
            cp "$TAR" "release-assets/Tuvis-${VERSION}-macOS.tar.gz"
            [ -f "${TAR}.sig" ] && cp "${TAR}.sig" "release-assets/Tuvis-${VERSION}-macOS.tar.gz.sig" || true
          fi
          ls -la release-assets/

      - name: Prepare Windows Assets
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          $VERSION = $env:GITHUB_REF_NAME.Substring(1)
          $setup = Get-ChildItem -Path 'src-tauri/target/release/bundle/nsis' -Recurse -Include *.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($null -eq $setup) { throw 'No NSIS setup.exe found' }
          Copy-Item $setup.FullName "release-assets/Tuvis-$VERSION-Windows-x64-setup.exe"
          if (Test-Path "$($setup.FullName).sig") {
            Copy-Item "$($setup.FullName).sig" "release-assets/Tuvis-$VERSION-Windows-x64-setup.exe.sig"
          }
          Get-ChildItem release-assets | Format-Table Name, Length

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ runner.os }}
          path: release-assets/*
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: release
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Download built artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-assets-*
          path: release-assets
          merge-multiple: true

      - name: Build release body
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          BODY="$RUNNER_TEMP/body.md"
          {
            echo "## Tuvis ${GITHUB_REF_NAME}"
            echo ""
            echo "### 下载"
            echo ""
            echo "- **macOS**: \`Tuvis-${VERSION}-macOS.dmg\`"
            echo "- **macOS (updater)**: \`Tuvis-${VERSION}-macOS.tar.gz\`（自动更新专用，无需手动下载）"
            echo "- **Windows (x86_64)**: \`Tuvis-${VERSION}-Windows-x64-setup.exe\`"
            echo ""
            echo "---"
            echo ""
            echo "### 更新内容"
            echo ""
            if [ -f "docs/release-notes/v${VERSION}.md" ]; then
              cat "docs/release-notes/v${VERSION}.md"
            else
              echo "_本次更新内容见上方下载清单。_"
            fi
          } > "$BODY"
          echo "RELEASE_BODY_PATH=$BODY" >> "$GITHUB_ENV"

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          body_path: ${{ env.RELEASE_BODY_PATH }}
          # 直接发正式版（用户裁决 2026-10-10：不再走草稿人工验收）。注意时序：
          # 本 job 先发布 release，assemble-latest-json 随后补传 latest.json——
          # 间隙内 latest.json 暂缺，updater 侧表现为「暂无更新」，数秒后自愈。
          # v2 对已存在的 release 只覆盖 assets 不覆盖 body；body 由 body_path 在
          # 创建时写入（内容 = docs/release-notes/v{VERSION}.md）
          draft: false
          prerelease: false
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  assemble-latest-json:
    name: Assemble latest.json
    runs-on: ubuntu-latest
    needs: publish-release
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p dl
          gh release download "$GITHUB_REF_NAME" --dir dl --repo "$GITHUB_REPOSITORY"
          ls -la dl/

      - name: Generate latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          node <<'NODE'
          const fs = require("fs"), path = require("path");
          const tag = process.env.TAG;
          const repo = process.env.REPO;
          const base = `https://github.com/${repo}/releases/download/${tag}`;
          const version = tag.replace(/^v/i, "");
          const sigFiles = fs.readdirSync("dl").filter((f) => f.endsWith(".sig"));
          const platforms = {};
          for (const f of sigFiles) {
            const asset = f.slice(0, -4);
            const url = `${base}/${encodeURIComponent(asset)}`;
            const signature = fs.readFileSync(path.join("dl", f), "utf8").trim();
            if (asset.endsWith("-macOS.tar.gz")) {
              platforms["darwin-aarch64"] = { signature, url };
              platforms["darwin-x86_64"] = { signature, url };
            } else if (asset.endsWith("-Windows-x64-setup.exe")) {
              platforms["windows-x86_64"] = { signature, url };
            }
          }
          let notes = `Release ${tag}`;
          const notesFile = `docs/release-notes/v${version}.md`;
          if (fs.existsSync(notesFile)) {
            notes = fs.readFileSync(notesFile, "utf8");
          }
          const pubDate = new Date().toISOString().replace(/\.\d{3}Z$/, "Z");
          const payload = { version, notes, pub_date: pubDate, platforms };
          if (Object.keys(platforms).length > 0) {
            fs.writeFileSync("latest.json", JSON.stringify(payload, null, 2) + "\n");
            console.log(fs.readFileSync("latest.json", "utf8"));
          } else {
            console.log("No signed assets found, skipping latest.json (TAURI_SIGNING_PRIVATE_KEY not configured)");
          }
          NODE

      - name: Upload latest.json to release
        if: hashFiles('latest.json') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" latest.json --clobber --repo "$GITHUB_REPOSITORY"
