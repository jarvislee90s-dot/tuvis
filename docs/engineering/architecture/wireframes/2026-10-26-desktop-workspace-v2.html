<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>兔维斯 · 双指标与中性材质讨论稿</title>
    <link rel="icon" href="data:," />
    <style>
      :root {
        --bg: #f5f6f8;
        --paper: #fff;
        --ink: #202735;
        --muted: #696962;
        --line: #e5e8ee;
        --blue: #555555;
        --tint: #eeeee8;
        --green: #228569;
        --shadow: 0 12px 48px #25334a0c;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #e9ecf1;
        color: var(--ink);
        font:
          14px -apple-system,
          BlinkMacSystemFont,
          "PingFang SC",
          "Microsoft YaHei",
          sans-serif;
      }
      button,
      input,
      select {
        font: inherit;
      }
      button,
      select {
        cursor: pointer;
      }
      button {
        border: 0;
        background: none;
        color: inherit;
      }
      button:focus-visible,
      input:focus-visible,
      select:focus-visible,
      [tabindex]:focus-visible {
        outline: 2px solid var(--blue);
        outline-offset: 3px;
      }
      button:hover {
        filter: brightness(0.98);
      }
      .lab {
        max-width: 1240px;
        margin: auto;
        padding: 22px 24px 34px;
      }
      .labbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 14px;
      }
      .labtitle {
        font-size: 13px;
        font-weight: 650;
      }
      .labtitle span {
        font-weight: 400;
        color: #72726b;
        margin-left: 10px;
      }
      .compare {
        background: #dce1e9;
        border-radius: 9px;
        padding: 3px;
        display: flex;
        gap: 2px;
      }
      .compare button {
        padding: 8px 13px;
        border-radius: 7px;
        font-size: 12px;
      }
      .compare button.on {
        background: white;
        box-shadow: 0 2px 5px #00000008;
      }
      .recommend {
        color: var(--blue);
        font-size: 10px;
        margin-left: 5px;
      }
      .shell {
        background: var(--paper);
        border: 1px solid #d8dde6;
        border-radius: 14px;
        box-shadow: var(--shadow);
        overflow: hidden;
        position: relative;
      }
      .windowbar {
        height: 46px;
        display: flex;
        align-items: center;
        padding: 0 20px;
        border-bottom: 1px solid var(--line);
        gap: 18px;
      }
      .dots {
        display: flex;
        gap: 7px;
      }
      .dots i {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #fa716a;
      }
      .dots i:nth-child(2) {
        background: #eab94b;
      }
      .dots i:nth-child(3) {
        background: #60ba82;
      }
      .brand {
        font-weight: 650;
        font-size: 13px;
      }
      .windowbar .right {
        margin-left: auto;
        display: flex;
        gap: 18px;
        align-items: center;
        color: var(--muted);
        font-size: 12px;
      }
      .demo {
        border: 1px solid var(--line);
        border-radius: 5px;
        padding: 3px 6px;
        font-size: 10px;
        color: #8b93a0;
      }
      .nav {
        height: 59px;
        display: flex;
        align-items: stretch;
        padding: 0 25px;
        gap: 28px;
        border-bottom: 1px solid var(--line);
      }
      .nav button {
        font-size: 13px;
        border-bottom: 2px solid transparent;
        display: flex;
        align-items: center;
        gap: 7px;
        color: var(--muted);
        white-space: nowrap;
      }
      .nav button.on {
        color: var(--blue);
        border-color: var(--blue);
        font-weight: 650;
      }
      .icon {
        width: 16px;
        height: 16px;
        display: inline-block;
        vertical-align: -3px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.6;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .workspace {
        background: var(--bg);
        padding: 25px 27px 27px;
        min-height: 655px;
      }
      .pagehead {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 15px;
        margin-bottom: 20px;
      }
      h1 {
        font-size: 23px;
        letter-spacing: -0.5px;
        margin: 0 0 6px;
        font-weight: 650;
      }
      h2 {
        margin: 0;
        font-size: 15px;
        font-weight: 650;
      }
      p {
        margin: 0;
      }
      .sub {
        font-size: 12px;
        color: var(--muted);
        line-height: 1.7;
      }
      .headacts {
        display: flex;
        gap: 10px;
        align-items: center;
      }
      .btn {
        border: 1px solid #dce0e8;
        border-radius: 8px;
        padding: 9px 12px;
        background: white;
        font-size: 12px;
        white-space: nowrap;
      }
      .btn.primary {
        background: var(--blue);
        color: white;
        border-color: var(--blue);
      }
      .live {
        font-size: 11px;
        color: var(--green);
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .live:before {
        content: "";
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--green);
      }
      .speedgrid {
        display: grid;
        grid-template-columns: 255px minmax(0, 1fr);
        gap: 17px;
      }
      .panel {
        background: var(--paper);
        border: 1px solid var(--line);
        border-radius: 11px;
      }
      .listhead {
        padding: 17px 15px 12px;
      }
      .listhead h2 {
        font-size: 13px;
        margin-bottom: 12px;
      }
      .search {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 7px;
        padding: 9px 10px;
        background: #fafbfc;
        font-size: 12px;
        color: var(--ink);
      }
      .listfilters {
        display: flex;
        gap: 6px;
        margin-top: 9px;
      }
      .listfilters select {
        width: 50%;
        font-size: 11px;
        padding: 6px 4px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: white;
        color: var(--muted);
      }
      .listlabels {
        display: flex;
        justify-content: space-between;
        padding: 0 16px 9px;
        font-size: 10px;
        color: #8b8b85;
      }
      .series {
        padding: 0 7px 10px;
        min-height: 400px;
      }
      .series button {
        width: 100%;
        display: flex;
        gap: 10px;
        align-items: center;
        text-align: left;
        padding: 12px 10px;
        border-radius: 8px;
        margin: 2px 0;
        border: 1px solid transparent;
      }
      .series button.selected {
        background: var(--tint);
        border-color: #dbdbd6;
      }
      .toolmark {
        width: 29px;
        height: 29px;
        border-radius: 8px;
        display: grid;
        place-items: center;
        background: #edf0f5;
        color: #697489;
        font-size: 12px;
        font-weight: 700;
        flex-shrink: 0;
      }
      .selected .toolmark {
        background: #e8e8e3;
        color: var(--blue);
      }
      .series .names {
        min-width: 0;
        flex: 1;
      }
      .series .names strong {
        display: block;
        font-size: 12px;
        font-weight: 550;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .series .names small {
        display: block;
        margin-top: 4px;
        font-size: 10px;
        color: var(--muted);
      }
      .series .rate {
        font-variant-numeric: tabular-nums;
        font-size: 13px;
        font-weight: 600;
      }
      .emptylist {
        padding: 30px 10px;
        color: var(--muted);
        font-size: 12px;
      }
      .mainpanel {
        min-width: 0;
      }
      .rangetoolbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        gap: 10px;
      }
      .ranges {
        display: flex;
        gap: 4px;
        background: #e8ebf1;
        border-radius: 8px;
        padding: 3px;
      }
      .ranges button {
        padding: 7px 12px;
        font-size: 11px;
        border-radius: 6px;
        white-space: nowrap;
      }
      .ranges .on {
        background: white;
        box-shadow: 0 1px 4px #27314f0b;
        font-weight: 600;
      }
      .tiny {
        font-size: 10px;
        color: #797973;
        line-height: 1.6;
      }
      .identity {
        display: flex;
        justify-content: space-between;
        gap: 15px;
        align-items: center;
        margin-bottom: 15px;
      }
      .identity h2 {
        font-size: 15px;
      }
      .identity .sub {
        margin-top: 4px;
      }
      .textbutton {
        font-size: 11px;
        color: var(--blue);
        padding: 3px;
      }
      .metricsbox {
        padding: 18px 19px 15px;
        margin-bottom: 14px;
      }
      .metriccontext {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 16px;
        font-size: 11px;
        color: var(--muted);
        min-height: 19px;
      }
      .metriccontext strong {
        color: #5a6475;
        font-weight: 500;
      }
      .metrics {
        display: grid;
        grid-template-columns: 1.22fr 1fr 1fr 1fr;
        gap: 16px;
        align-items: end;
      }
      .metric:not(:first-child) {
        border-left: 1px solid var(--line);
        padding-left: 18px;
      }
      .metric label {
        font-size: 10px;
        color: var(--muted);
        display: block;
        margin-bottom: 9px;
        white-space: nowrap;
      }
      .metric .value {
        font-size: 23px;
        line-height: 1;
        font-weight: 600;
        letter-spacing: -0.7px;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      .metric:first-child .value {
        font-size: 34px;
        color: var(--blue);
        font-weight: 700;
      }
      .unit {
        font-size: 10px;
        font-weight: 400;
        letter-spacing: 0;
        margin-left: 3px;
        color: var(--muted);
      }
      .chartbox {
        padding: 17px 18px 12px;
      }
      .charthead {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        margin-bottom: 7px;
      }
      .charthead h2 {
        font-size: 12px;
      }
      .gapmode {
        display: flex;
        gap: 7px;
        align-items: center;
        font-size: 10px;
        color: var(--muted);
      }
      .gapmode select {
        border: 0;
        color: var(--muted);
        background: #f5f6f9;
        border-radius: 5px;
        padding: 5px;
        font-size: 10px;
      }
      .chartwrap {
        position: relative;
        touch-action: none;
      }
      .chartwrap svg {
        display: block;
        width: 100%;
        height: auto;
        overflow: visible;
      }
      .chartfoot {
        display: flex;
        justify-content: space-between;
        font-size: 10px;
        color: #8a93a3;
        gap: 10px;
        margin-top: 3px;
        line-height: 1.7;
      }
      .charttip {
        position: absolute;
        pointer-events: none;
        background: #222c40;
        color: white;
        border-radius: 7px;
        padding: 8px 10px;
        font-size: 10px;
        line-height: 1.7;
        box-shadow: 0 6px 20px #1e2b4820;
        display: none;
        white-space: nowrap;
        z-index: 2;
      }
      .coverage {
        margin-top: 14px;
        display: flex;
        align-items: center;
        gap: 9px;
      }
      .coverage span {
        font-size: 10px;
        color: var(--muted);
        white-space: nowrap;
      }
      .coverstrip {
        height: 5px;
        display: flex;
        gap: 3px;
        flex: 1;
      }
      .coverstrip i {
        flex: 1;
        border-radius: 2px;
        background: #cecec6;
      }
      .coverstrip i.none {
        background: repeating-linear-gradient(
          135deg,
          #e1e5ec,
          #e1e5ec 2px,
          #f7f8fa 2px,
          #f7f8fa 4px
        );
      }
      .footnote {
        margin-top: 13px;
        font-size: 11px;
        line-height: 1.8;
        color: #797972;
      }
      .drawerShade {
        position: absolute;
        inset: 46px 0 0;
        background: #151d311c;
        z-index: 4;
        display: none;
      }
      .drawer {
        position: absolute;
        right: 0;
        top: 46px;
        bottom: 0;
        width: 360px;
        background: white;
        border-left: 1px solid var(--line);
        box-shadow: -15px 0 40px #25304b0c;
        z-index: 5;
        padding: 24px;
        overflow: auto;
        display: none;
      }
      .drawer h2 {
        font-size: 18px;
        margin-bottom: 7px;
      }
      .drawerclose {
        position: absolute;
        right: 18px;
        top: 19px;
        color: #929aaa;
        font-size: 21px;
      }
      .sourcerow {
        padding: 15px 0;
        border-bottom: 1px solid var(--line);
        display: flex;
        gap: 10px;
        align-items: center;
        justify-content: space-between;
      }
      .sourcerow strong {
        display: block;
        font-size: 13px;
        margin-bottom: 5px;
      }
      .sourcerow small {
        font-size: 11px;
        color: var(--muted);
      }
      .sourceinfo {
        padding: 18px 0;
        line-height: 1.9;
        font-size: 12px;
        color: #687487;
      }
      .sourceinfo summary {
        cursor: pointer;
        color: #475369;
      }
      .wizard {
        padding: 16px;
        background: #f5f5f1;
        border: 1px solid #deded7;
        border-radius: 9px;
        margin-top: 18px;
        font-size: 12px;
        line-height: 1.9;
      }
      .wizard h3 {
        margin: 0 0 10px;
        font-size: 13px;
      }
      .wizard ol {
        padding-left: 19px;
        margin: 10px 0 14px;
      }
      .wiznotice {
        color: var(--blue);
        font-size: 11px;
      }
      .topbar2 {
        display: none;
        background: white;
        border: 1px solid #d8dde6;
        border-bottom: 0;
        border-radius: 10px 10px 0 0;
        padding: 10px 16px;
        justify-content: space-between;
        font-size: 11px;
      }
      .floating .workspace {
        margin: 26px 30px 28px 100px;
        border: 1px solid #d8dde6;
        border-top: 0;
        border-radius: 0 0 10px 10px;
        box-shadow: 0 15px 40px #25334a20;
        min-height: 620px;
      }
      .floating .topbar2 {
        display: flex;
        margin: 27px 30px -26px 100px;
      }
      .floating.shell {
        background: #e8ebf0;
      }
      .floating .speedgrid {
        grid-template-columns: 235px minmax(0, 1fr);
      }
      .floating .metrics {
        gap: 8px;
      }
      .floating .metric:not(:first-child) {
        padding-left: 10px;
      }
      .floating .metric .value {
        font-size: 20px;
      }
      .floating .metric:first-child .value {
        font-size: 29px;
      }
      .tiles {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 16px;
      }
      .tile {
        padding: 20px;
        min-height: 170px;
      }
      .tile .tag {
        font-size: 10px;
        color: var(--green);
        padding: 4px 6px;
        background: #eef7f3;
        border-radius: 5px;
      }
      .tile h3 {
        font-size: 15px;
        margin-top: 22px;
        margin-bottom: 8px;
      }
      .resource {
        width: 100%;
        border-collapse: collapse;
        font-size: 12px;
      }
      .resource th,
      .resource td {
        text-align: left;
        padding: 16px;
        border-bottom: 1px solid var(--line);
      }
      .resource th {
        color: var(--muted);
        font-size: 11px;
        font-weight: 400;
      }
      .resource td small {
        color: var(--muted);
      }
      .usagecards {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 14px;
        margin-bottom: 20px;
      }
      .usagecards .panel {
        padding: 18px;
      }
      .usagecards .value {
        font-size: 27px;
        margin-top: 12px;
        font-weight: 650;
        letter-spacing: -0.7px;
      }
      .usagecards label {
        font-size: 11px;
        color: var(--muted);
      }
      .usagecontent {
        max-width: 950px;
        margin: auto;
      }
      .settingsgrid {
        display: grid;
        grid-template-columns: 165px 1fr;
        gap: 24px;
      }
      .settingsside button {
        display: block;
        width: 100%;
        text-align: left;
        padding: 12px;
        border-radius: 7px;
        color: var(--muted);
      }
      .settingsside button.on {
        background: var(--tint);
        color: var(--blue);
      }
      .settingrow {
        padding: 20px 0;
        border-bottom: 1px solid var(--line);
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .switch {
        width: 32px;
        height: 19px;
        background: var(--blue);
        border-radius: 20px;
        position: relative;
      }
      .switch:after {
        content: "";
        background: white;
        width: 13px;
        height: 13px;
        position: absolute;
        right: 3px;
        top: 3px;
        border-radius: 50%;
      }
      .toast {
        position: fixed;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%);
        background: #263148;
        color: white;
        border-radius: 8px;
        padding: 11px 18px;
        font-size: 12px;
        z-index: 20;
        display: none;
      }
      .below {
        display: flex;
        justify-content: space-between;
        gap: 20px;
        padding: 15px 4px 0;
        color: #6e788b;
        font-size: 11px;
        line-height: 1.8;
      }
      .below b {
        font-weight: 500;
        color: #4d5b74;
      }
      @media (max-width: 980px) {
        .lab {
          padding: 12px;
        }
        .speedgrid,
        .floating .speedgrid {
          grid-template-columns: 220px minmax(0, 1fr);
        }
        .workspace {
          padding: 20px 16px;
        }
        .metrics {
          gap: 9px;
        }
        .metric:not(:first-child) {
          padding-left: 11px;
        }
        .metric .value {
          font-size: 20px;
        }
        .metric:first-child .value {
          font-size: 29px;
        }
        .floating .workspace,
        .floating .topbar2 {
          margin-left: 35px;
          margin-right: 15px;
        }
        .nav {
          gap: 22px;
        }
        .ranges button {
          padding: 7px 8px;
        }
      }
      @media (max-width: 740px) {
        .labbar {
          align-items: start;
          flex-direction: column;
          gap: 10px;
        }
        .labtitle span {
          display: block;
          margin: 5px 0 0;
        }
        .windowbar {
          padding: 0 13px;
        }
        .nav {
          padding: 0 15px;
          gap: 18px;
          overflow: auto;
        }
        .nav button {
          font-size: 12px;
        }
        .nav .icon {
          display: none;
        }
        .workspace {
          padding: 20px 12px;
        }
        .speedgrid,
        .floating .speedgrid {
          grid-template-columns: 1fr;
        }
        .series {
          display: flex;
          overflow: auto;
          min-height: 0;
          padding: 0 7px 7px;
        }
        .series button {
          min-width: 185px;
        }
        .listhead {
          padding: 12px;
        }
        .listhead h2,
        .listlabels {
          display: none;
        }
        .listfilters {
          margin: 0;
          min-width: 45%;
        }
        .listhead {
          display: flex;
          gap: 8px;
        }
        .pagehead {
          align-items: start;
        }
        .headacts {
          gap: 6px;
        }
        .live {
          display: none;
        }
        .metrics {
          grid-template-columns: repeat(2, 1fr);
          gap: 20px;
        }
        .metric:nth-child(3) {
          padding-left: 0;
          border-left: 0;
        }
        .metric:first-child .value {
          font-size: 30px;
        }
        .metric label {
          font-size: 11px;
        }
        .metric .value {
          font-size: 24px;
        }
        .tiles {
          grid-template-columns: 1fr;
        }
        .usagecards {
          grid-template-columns: repeat(2, 1fr);
        }
        .drawer {
          width: min(360px, 100%);
        }
        .below {
          flex-direction: column;
          gap: 8px;
        }
        .floating .workspace,
        .floating .topbar2 {
          margin-left: 15px;
          margin-right: 15px;
        }
        .settingsgrid {
          grid-template-columns: 1fr;
        }
        .settingsside {
          display: flex;
        }
        .chartfoot {
          flex-direction: column;
          gap: 0;
        }
        .ranges button {
          font-size: 11px;
        }
        .tiny {
          font-size: 9px;
        }
        .resource th:nth-child(3),
        .resource td:nth-child(3) {
          display: none;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          transition: none !important;
          animation: none !important;
        }
      }

      :root {
        --bg: #f1f1ee;
        --paper: #ffffff;
        --ink: #242423;
        --muted: #696962;
        --line: #deded7;
        --blue: #555550;
        --tint: #ecece6;
        --green: #377a56;
        --soft: #c9c9bc;
        --shadow: 0 18px 60px #26262112;
      }
      body {

      function renderUsage() {

        renderUsageChart();

      function renderUsageChart() {
        let W = 940,
          H = 240,
          L = 48,
          R = 18,
          T = 24,
          B = 32,
          iw = W - L - R,
          ih = H - T - B,
          vals = [
            21, 40, 32, 47, 56, 65, 33, 24, 48, 67, 52, 71, 60, 55, 73, 64, 55, 45, 28, 15, 10, 0,
            0, 0,
          ],
          max = 80;
        let s = `<svg viewBox="0 0 ${W} ${H}" style="width:100%"><defs><linearGradient id="usagefill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#757575" stop-opacity=".18"/><stop offset="1" stop-color="#757575" stop-opacity=".01"/></linearGradient></defs>`;
        [0, 20, 40, 60, 80].forEach(
          (v) =>
            (s += `<line x1="${L}" x2="${W - R}" y1="${T + ih * (1 - v / max)}" y2="${T + ih * (1 - v / max)}" stroke="#e8ecf2"/><text x="${L - 12}" y="${T + ih * (1 - v / max) + 3}" text-anchor="end" fill="#929bac" font-size="10">${v}K</text>`)
        );
        let p = vals
          .map((v, i) => `${i ? "L" : "M"}${L + (i / 23) * iw},${T + ih * (1 - v / max)}`)
          .join(" ");
        s += `<path d="${p} L${W - R},${T + ih} L${L},${T + ih} Z" fill="url(#usagefill)"/><path d="${p}" stroke="var(--blue)" stroke-width="2.2" stroke-linejoin="round" fill="none"/>`;
        vals.forEach(
          (v, i) =>
            (s += `<circle cx="${L + (i / 23) * iw}" cy="${T + ih * (1 - v / max)}" r="2.4" fill="var(--paper)" stroke="var(--blue)"><title>${i}:00：${v}K Token</title></circle>`)
        );
        [0, 6, 12, 18, 24].forEach(
          (v) =>
            (s += `<text x="${L + (v / 24) * iw}" y="${H - 8}" text-anchor="middle" fill="#929bac" font-size="10">${String(v).padStart(2, "0")}:00</text>`)
        );
        s += "</svg>";
        document.getElementById("usagechart").innerHTML = s;
      }
